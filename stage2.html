<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal | 走れ！ぎだにゃん！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap"
    >

    <link rel="stylesheet" href="style.css?v=20261002-manga-first1">
</head>

<body data-difficulty="normal" data-difficulty-label="Normal">

    <main>

        <div class="stage-title">
            <h1>Normal</h1>
        </div>

        <div class="manga-box">

            <img
            id="mangaImage"
            class="manga-image"
            src="images/stage1_manga-p1.png"
            alt="Normalの漫画・1ページ目"
            fetchpriority="high"
            decoding="async"
            hidden
            >

            <p id="mangaStatus" class="unity-status" role="status" aria-live="polite">漫画を読み込んでいます…</p>
            <button id="mangaRetryBtn" class="gida-btn manga-retry" type="button" hidden>
                <span class="btn-text">漫画を再試行</span>
            </button>

            <div id="pageNumber" class="manga-page" hidden>
                1 / 4
            </div>

        </div>

        <button id="nextBtn" class="gida-btn" type="button" disabled>
            <span class="btn-text">漫画読込中…</span>
        </button>

        <p id="unityStatus" class="unity-status" role="status" aria-live="polite" hidden></p>

        <!-- Unityゲーム表示領域 -->
        <div id="unityContainer" class="unity-container is-preloading" aria-hidden="true">

            <iframe
                id="unityFrame"
                class="unity-frame"
                title="Normal | 走れ！ぎだにゃん！"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>

        </div>

        <a href="stage-select.html" class="gida-btn back-btn">

            <span class="back-arrow" aria-hidden="true">←</span>
            <span class="btn-text">BACK</span>

        </a>

    </main>

    <script src="script.js?v=20261002-swipe1"></script>

</body>

</html>
