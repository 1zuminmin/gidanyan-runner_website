<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal | 走れ！ぎだにゃん！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap"
    >

    <link rel="stylesheet" href="../assets/css/common.css?v=20261008-navigation2">
    <link rel="stylesheet" href="style.css?v=20261026-loading1">
</head>

<body data-difficulty="normal" data-difficulty-label="Normal">

    <main>

        <header id="stageHeader" class="stage-header">
            <a id="stageBackLink" href="stage-select.html" class="back-link">
                <span aria-hidden="true">←</span> 戻る
            </a>
            <h1>Normal</h1>
        </header>

        <section id="mangaReader" aria-label="ゲーム開始前の漫画">
            <div id="mangaTrack" class="manga-swipe" tabindex="0" role="region" aria-label="開始前の漫画。左右にスワイプして読む"><div class="manga-slide"><div class="manga-box full-page-manga">

                <img
                id="mangaImage"
                class="manga-image"
                src="stories/before/normal/01.jpg"
                alt="Normalの漫画・1ページ目"
                width="1440"
                height="2560"
                fetchpriority="high"
                decoding="async"
                hidden
                >
            </div>

            </div></div>
            <p class="swipe-hint">← 左右にスワイプして読んでね →</p>
            <p id="mangaStatus" class="unity-status" role="status" aria-live="polite">漫画を読み込んでいます…</p>
            <button id="mangaRetryBtn" class="gida-btn manga-retry" type="button" hidden>
                <span class="btn-text">漫画を再試行</span>
            </button>

            <div id="pageNumber" class="manga-page" hidden>
                1 / 4
            </div>

            <button id="nextBtn" class="gida-btn manga-play" type="button" disabled>
                <span class="btn-text">PLAY</span>
            </button>
        </section>

        <progress id="unityProgress" class="unity-progress" max="100" value="0" aria-label="ゲームの読み込み進捗" hidden></progress>
        <p id="unityStatus" class="unity-status" role="status" aria-live="polite" hidden></p>

        <!-- Unityゲーム表示領域 -->
        <div id="unityContainer" class="unity-container is-preloading" aria-hidden="true">

            <iframe
                id="unityFrame"
                class="unity-frame"
                title="Normal | 走れ！ぎだにゃん！"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>

        </div>


        <section id="clearStory" class="clear-story" aria-label="クリア後ストーリー" hidden>
            <p class="clear-message" role="status">クリアおめでとう！ 続きのお話を読んでみよう。</p>
            <button id="openClearStory" class="gida-btn" type="button" aria-expanded="false" aria-controls="clearStoryReader"><span class="btn-text">クリア後ストーリーを読む</span></button>
            <section id="clearStoryReader" hidden>
                <h2 id="clearStoryTitle" tabindex="-1">クリア後ストーリー</h2>
                <p id="clearStoryStatus" role="status"></p>
                <div id="clearStoryPages" class="manga-swipe" tabindex="0" role="region" aria-label="プレイ後の漫画。左右にスワイプして読む"></div>
                <div id="clearStoryNavigation" hidden>
                    <p id="clearStoryPageNumber" class="manga-page" aria-live="polite"></p>
                    <p class="swipe-hint">← 左右にスワイプして読んでね →</p>
                </div>
                <button id="closeClearStory" class="back-link" type="button">漫画を閉じる</button>
            </section>
        </section>
    </main>
    <aside id="storyNotice" class="story-notice" aria-label="漫画のお知らせ" hidden>
        <button id="dismissStoryNotice" class="story-notice-close" type="button" aria-label="漫画のお知らせを閉じる">×</button>
        <p role="status">続きの漫画が読めるよ！</p>
        <button id="openStoryNotice" class="gida-btn" type="button" aria-controls="clearStoryReader"><span class="btn-text">クリア後の漫画を読む →</span></button>
    </aside>

    <script src="manga-swipe.js?v=20261025-swipe1"></script>
    <script src="script.js?v=20261026-loading2"></script>

<script src="after-story.js?v=20261028-result-notice1"></script>
</body>

</html>
