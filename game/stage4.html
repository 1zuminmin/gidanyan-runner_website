<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EX | 走れ！ぎだにゃん！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap"
    >

    <link rel="stylesheet" href="../assets/css/common.css?v=20261008-navigation2">
    <link rel="stylesheet" href="style.css?v=20261008-navigation2">
</head>

<body data-difficulty="ex" data-difficulty-label="EX">

    <main>

        <header class="stage-header">
            <a href="stage-select.html" class="back-link">
                <span aria-hidden="true">←</span> 戻る
            </a>
            <h1>EX</h1>
        </header>

        <section id="mangaReader" aria-label="ゲーム開始前の漫画">
            <div class="manga-box">

                <img
                id="mangaImage"
                class="manga-image"
                src="images/stage1_manga-p1.png"
                alt="EXの漫画・1ページ目"
                width="1536"
                height="2048"
                fetchpriority="high"
                decoding="async"
                hidden
                >
            </div>

            <p id="mangaStatus" class="unity-status" role="status" aria-live="polite">漫画を読み込んでいます…</p>
            <button id="mangaRetryBtn" class="gida-btn manga-retry" type="button" hidden>
                <span class="btn-text">漫画を再試行</span>
            </button>

            <div id="pageNumber" class="manga-page" hidden>
                1 / 4
            </div>

            <div class="manga-navigation" role="group" aria-label="漫画のページ操作">
                <button id="prevBtn" class="gida-btn" type="button" disabled>
                    <span class="btn-text">BACK</span>
                </button>
                <button id="nextBtn" class="gida-btn" type="button" disabled>
                    <span class="btn-text">漫画読込中…</span>
                </button>
            </div>
        </section>

        <p id="unityStatus" class="unity-status" role="status" aria-live="polite" hidden></p>

        <!-- Unityゲーム表示領域 -->
        <div id="unityContainer" class="unity-container is-preloading" aria-hidden="true">

            <iframe
                id="unityFrame"
                class="unity-frame"
                title="EX | 走れ！ぎだにゃん！"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>

        </div>

    </main>

    <script src="script.js?v=20261008-navigation1"></script>

</body>

</html>
